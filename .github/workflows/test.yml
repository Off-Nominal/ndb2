name: Test Suite

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "db/**"
      - "types/**"

permissions:
  contents: read

env:
  NODE_ENV: test
  # Must match api default; used for integration tests (ephemeral DBs + schema template).
  TEST_POSTGRES_BASE_URL: postgresql://test_user:test_password@localhost:5433/ndb2_test

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install database client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base postgresql-client

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: |
          pnpm --filter @offnominal/ndb2-api-types build
          pnpm --filter @offnominal/ndb2-db build

      - name: Start test database (Docker)
        working-directory: ./db/scripts
        run: |
          chmod +x start-db.sh
          ./start-db.sh test

      - name: Wait for Postgres on host port
        run: |
          until pg_isready -h localhost -p 5433 -U test_user -d ndb2_test; do
            echo "Waiting for database on localhost:5433..."
            sleep 2
          done

      - name: Run tests
        run: pnpm test
